<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — ميمو منصتي</title>
<link id="faviconLink" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141419'/%3E%3Cg fill='none' stroke-linecap='round'%3E%3Cpath d='M25 84 C 25 58, 29 40, 34 20' stroke='%23A29BFE' stroke-width='8'/%3E%3Cpath d='M66 20 C 71 40, 75 58, 75 84' stroke='%236C5CE7' stroke-width='8'/%3E%3Cpath d='M34 20 C 42 32, 47 46, 50 52 C 53 46, 58 32, 66 20' stroke='%23F9CA24' stroke-width='8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=cfTurnstileInit" async defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="auth" data-auth-page="login">

<!-- Animated background orbs -->
<div class="bg-orbs">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
</div>

<!-- Golden threads background (fil d'or) -->
<div class="bg-threads" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <path class="thread gold" d="M-50 720 C 250 480, 550 860, 900 620 C 1100 500, 1300 560, 1500 380"/>
    <path class="thread gold" d="M-50 120 C 280 40, 550 240, 850 140 C 1100 60, 1300 200, 1500 100"/>
    <path class="thread violet" d="M-50 260 C 300 420, 600 160, 950 380 C 1150 520, 1300 280, 1500 460"/>
    <path class="thread pale" d="M-50 500 C 350 640, 700 320, 1000 520 C 1180 620, 1360 420, 1500 560"/>
    <path class="thread violet" d="M-50 380 C 400 560, 750 240, 1100 440 C 1280 560, 1400 400, 1500 500"/>
  </svg>
</div>

<!-- Confetti / sparkles background -->
<div class="bg-confetti" id="bgConfetti" aria-hidden="true"></div>

<!-- Bokeh background -->
<div class="bg-bokeh" id="bgBokeh" aria-hidden="true"></div>

<!-- Chrome partagé (topbar, nav mobile, footer, widgets) injecté par js/shell.js -->
<div id="siteShell"></div>

<!-- ============ PAGE: LOGIN ============ -->
<main class="page">
  <div class="auth-page-wrap">
    <div class="auth-page-card">
      <a class="auth-page-back" href="index.html" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1 class="auth-page-title" data-i18n="auth_page_title_login">أهلاً بعودتك! 👋</h1>
      <p class="auth-page-sub" data-i18n="auth_page_sub_login">سجّلي الدخول لطلب منتجاتك ومتابعة تعليقاتك</p>

      <form class="auth-form" onsubmit="doLogin(event)">
        <label data-i18n="auth_email">البريد الإلكتروني</label>
        <input type="email" name="l_email" required autocomplete="email">
        <label data-i18n="auth_password">كلمة المرور</label>
        <input type="password" name="l_password" required autocomplete="current-password">
        <div class="cf-box">
          <div class="cf-box-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5z"/><path d="M9 12l2 2 4-4"/></svg>
            <span data-i18n="auth_captcha_label">التحقق من الأمان</span>
            <span class="cf-dot"></span>
          </div>
          <div class="cf-turnstile-wrap" id="cfTurnstileLogin"></div>
        </div>
        <button type="submit" class="submit-btn" data-i18n="auth_tab_login">تسجيل الدخول</button>
      </form>

      <div class="auth-page-foot"><a href="reset-password.html" data-i18n="auth_page_forgot_link">نسيت كلمة المرور؟</a></div>

      <div class="auth-divider"><span data-i18n="auth_or">أو</span></div>

      <button type="button" class="auth-google" onclick="googleLogin()">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span data-i18n="auth_google">المتابعة عبر جوجل</span>
      </button>

      <div class="auth-page-foot"><span data-i18n="auth_page_to_register">ليس لديك حساب؟</span> <a href="register.html" data-i18n="auth_page_to_register_link">أنشئي حسابًا</a></div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>

<!-- Liquid ink engine (webgl-fluid-simulation, moteur upgrowth.dz) -->
<script src="js/vendor/liquid-ink.js"></script>
</body>
</html>
